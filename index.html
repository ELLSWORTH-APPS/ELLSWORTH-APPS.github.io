<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ellsworth Apps</title>
<meta name="description" content="Company apps for Ellsworth and Son Excavating.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E3346">
<link rel="icon" type="image/png" sizes="192x192" href="parts/icons/icon-192.png">
<link rel="stylesheet" href="parts/fonts/fonts.css">
<style>
  :root {
    --steel: #D6DEE5; --label: #FFFFFF; --ink: #132231; --ink-2: #4B5B6A; --frame: #A9B6C2;
    --cabinet: #1E3346; --cabinet-ink: #F3F6F9; --cabinet-ink-2: #B3C3D1; --tan: #E7D6A3; --tan-ink: #3A2F12;
    --focus: #0B63CE;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --steel: #0D141B; --label: #16212C; --ink: #E3EAF1; --ink-2: #9AABBA; --frame: #364654;
      --cabinet: #09121A; --cabinet-ink: #E3EAF1; --cabinet-ink-2: #8FA2B3; --tan: #D8C68F; --tan-ink: #2E250C;
      --focus: #78B4FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --steel: #0D141B; --label: #16212C; --ink: #E3EAF1; --ink-2: #9AABBA; --frame: #364654;
    --cabinet: #09121A; --cabinet-ink: #E3EAF1; --cabinet-ink-2: #8FA2B3; --tan: #D8C68F; --tan-ink: #2E250C;
    --focus: #78B4FF;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--steel); color: var(--ink);
    font: 400 17px/1.45 "Plex Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: var(--cabinet); color: var(--cabinet-ink); padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 18px; }
  .in { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { position: relative; flex: none; width: 56px; height: 34px; display: grid; place-items: center; padding-left: 14px;
    background: var(--tan); color: var(--tan-ink); font: 700 15px/1 "Plex Condensed", system-ui, sans-serif;
    clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  .mark::before { content: ""; position: absolute; left: 7px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--cabinet); }
  h1 { margin: 0; font: 600 24px/1.1 "Plex Condensed", system-ui, sans-serif; }
  header p { margin: 4px 0 0; color: var(--cabinet-ink-2); font-size: 15px; }
  main { padding: 20px 16px 40px; }
  .app { display: flex; align-items: center; gap: 16px; padding: 14px 16px; min-height: 88px; background: var(--label);
    border: 2px solid var(--frame); border-radius: 6px; color: inherit; text-decoration: none; }
  .app:hover { border-color: var(--ink-2); }
  .app:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .app img { flex: none; width: 56px; height: 56px; border-radius: 12px; }
  .app strong { display: block; font: 600 22px/1.15 "Plex Condensed", system-ui, sans-serif; }
  .app span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 16px; }
  .note { margin: 16px 2px 0; color: var(--ink-2); font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="in brand">
    <div class="mark" aria-hidden="true">E&amp;S</div>
    <div>
      <h1>Ellsworth apps</h1>
      <p>Ellsworth and Son Excavating</p>
    </div>
  </div>
</header>
<main>
  <div class="in">
    <a class="app" href="parts/">
      <img src="parts/icons/icon-192.png" alt="">
      <div><strong>Parts</strong><span>Filters, teeth and service parts in stock. Works with no signal.</span></div>
    </a>
    <p class="note">Each app asks for your code the first time it opens.</p>
  </div>
</main>
</body>
</html>
