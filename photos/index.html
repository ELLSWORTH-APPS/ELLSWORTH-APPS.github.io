<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Photos</title>
<meta name="description" content="Job site photos for Ellsworth and Son Excavating. Works with no signal.">
<meta name="theme-color" content="#E0115F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Photos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><div class="boot">Opening Job Photos…</div></div>
<div id="upbar" class="upbar hidden" aria-live="polite"></div>
<div id="toast" class="toast" role="status"></div>
<input id="pickCam" type="file" accept="image/*" capture="environment" class="sr" tabindex="-1">
<input id="pickLib" type="file" accept="image/*" multiple class="sr" tabindex="-1">
<input id="pickDir" type="file" webkitdirectory directory multiple class="sr" tabindex="-1">
<noscript><p style="padding:16px">Job Photos needs JavaScript turned on.</p></noscript>
<script src="version.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
