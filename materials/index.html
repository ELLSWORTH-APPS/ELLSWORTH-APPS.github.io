<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ellsworth Materials</title>
<meta name="description" content="Pipe, fittings and supplies in stock at Ellsworth and Son Excavating.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15603A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Materials">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Ellsworth Materials. A stock board for the crew's phones.
   Everything you tap is round: each section is a paint dot with a picture of what's in it, and the
   screens ride on pills. The one sharp shape is the strip of survey flagging tape (red OUT, orange LOW,
   blue ORDERED), so whatever needs attention is what catches the eye. Items that are OK stay quiet.
   Names and numbers are set in Fredoka; everything you read is Nunito, which stays narrow enough to
   keep a full item name on one line of a phone. */
:root {
  --canvas: #E7EEE5;
  --surface: #FFFFFF;
  --ink: #16211B;
  --ink-2: #47554D;
  --ink-3: #5C6A62;
  --line: #CFD8CD;
  --line-2: #E6ECE4;
  --pipe: #15603A;
  --pipe-2: #0E4A2B;
  --hivis: #D8F24A;
  --out: #D3261A;     --out-txt: #B81E13;  --out-soft: #FBE4E1;
  --low: #FF7A1A;     --low-txt: #A8430A;  --low-soft: #FFEAD9;
  --ord: #1565C0;     --ord-txt: #1357A6;  --ord-soft: #E2EDFA;
  --ok: #1F7F3C;      --ok-txt: #1B6E34;   --ok-soft: #DFF1E3;
  --focus: #1565C0;
  --f: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --d: "Fredoka", "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabs: 64px;
  --r: 24px;
  --g: max(16px, calc(50vw - 364px));   /* the page's side gutter: 16px on a phone, wider once the screen passes 760px */
  --pop: cubic-bezier(.3, 1.5, .5, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 600 16px/1.35 var(--f); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--ord-txt); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
/* whatever you press gives a little under your thumb */
.cat, .chip, .sub, .btn, .mark, .step, .tape, .x-btn, .tabs button { transition: transform .12s ease-out; }
.cat:active, .chip:active, .sub:active, .btn:active, .mark:active, .step:active, .tape:active, .x-btn:active, .tabs button:active { transform: scale(.95); }

/* ---------- top: a green band. Each screen hangs a rounded cap off it: the search box, or the screen's name */
.top { background: var(--pipe); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
.top:has(+ #signin:not([hidden])) { border-radius: 0 0 28px 28px; }
.top-in { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 calc(var(--g) + 2px); }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font: 700 25px/1 var(--d); }
.brand p { margin: 2px 0 0; font: 600 12.5px/1.2 var(--f); color: rgba(255, 255, 255, .84); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(255, 255, 255, .13); font: 700 12.5px/1 var(--f); color: #fff; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hivis); }
.sync.saving::before { background: #FFD25A; animation: blink 1s ease-in-out infinite; }
.sync.off { background: #FFD9D4; color: #7A1810; }
.sync.off::before { background: var(--out); }
.sync:empty { display: none; }
@keyframes blink { 50% { opacity: .3; } }
.preview { background: #FFF4C2; color: #4A3B00; font: 600 14px/1.35 var(--f); padding: 10px 16px; border-bottom: 1px solid #EAD98A; }
.preview b { font-weight: 800; }

/* ---------- page frame */
main { padding-bottom: calc(var(--tabs) + 40px + env(safe-area-inset-bottom)); }
.view { min-height: 40vh; }
.h2 { margin: 0 0 16px; padding: 2px calc(var(--g) + 2px) 20px; background: var(--pipe); color: #fff; border-radius: 0 0 28px 28px; font: 700 28px/1.15 var(--d); overflow-wrap: anywhere; }
.lead { margin: -2px calc(var(--g) + 2px) 14px; color: var(--ink-2); font-size: 15px; }
.empty { margin: 16px var(--g); padding: 22px 20px; background: var(--surface); border-radius: var(--r); color: var(--ink-2); font-size: 16px; }
.empty b { color: var(--ink); display: block; font: 600 18px/1.25 var(--d); margin-bottom: 4px; }

/* ---------- search rides in the green cap at the top of Stock */
.find { position: relative; margin: 0 0 14px; padding: 2px var(--g) 18px; background: var(--pipe); border-radius: 0 0 28px 28px; }
.find input { width: 100%; height: 50px; border: 0; border-radius: 25px; background: var(--surface); padding: 0 48px 0 46px; font-size: 16.5px; }
.find input::placeholder { color: var(--ink-3); }
.find input::-webkit-search-cancel-button { display: none; }
.find input:focus-visible { outline: 3px solid var(--hivis); outline-offset: 2px; }
.find > .i { position: absolute; left: calc(var(--g) + 15px); top: 16px; color: var(--ink-3); }
.find .x { position: absolute; right: calc(var(--g) + 4px); top: 6px; width: 42px; height: 42px; border: 0; background: none; color: var(--ink-3); border-radius: 21px; display: grid; place-items: center; }

/* ---------- what needs attention: strips of tape that count, and filter the list when you tap one */
.tally { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 2px calc(var(--g) + 2px) 0; }
.tally:empty { display: none; }
.tally + #qrBox:not(:empty) { margin-top: 14px; }
.tape { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 24px 0 14px; border: 0; font: 600 14.5px/1 var(--d); letter-spacing: .06em; clip-path: polygon(0 0, 100% 0, calc(100% - 11px) 50%, 100% 100%, 0 100%); rotate: -1.5deg; }
.tape:nth-child(even) { rotate: 1.2deg; }
.tape b { font: 700 23px/1 var(--d); letter-spacing: 0; }
.tape.out { background: var(--out); color: #fff; }
.tape.low { background: var(--low); color: var(--ink); }
.tape.ordered { background: var(--ord); color: #fff; }
.tape[aria-pressed="true"] { rotate: 0deg; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .3); }
.allgood { display: inline-flex; align-items: center; gap: 8px; height: 40px; font: 600 16px/1 var(--d); color: var(--ok-txt); }
.filter-note { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px calc(var(--g) + 2px) 0; font: 700 15px var(--f); color: var(--ink-2); }
.link-btn { border: 0; background: none; padding: 8px 0; font: 800 15px var(--f); color: var(--ord-txt); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- sections: a paint dot with a picture of what's inside. --c is the dot's color */
.dot { position: relative; flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--c, var(--pipe)); color: var(--ci, #fff); }
.dot svg.i { width: 28px; height: 28px; stroke-width: 1.8; }
.pip { position: absolute; top: -4px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; box-shadow: 0 0 0 2px var(--surface); background: var(--out); color: #fff; font: 600 13px/22px var(--d); font-style: normal; text-align: center; }
.pip.low { background: var(--low); color: var(--ink); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 14px var(--g) 0; }
.cat { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 60px; padding: 7px 12px 7px 7px; border: 0; border-radius: 30px; background: var(--surface); text-align: left; }
.cat .txt { min-width: 0; }
.cat .nm { display: block; font: 600 15.5px/1.12 var(--d); overflow-wrap: anywhere; }
.cat .ds { display: block; margin-top: 2px; font: 700 12.5px/1.2 var(--f); color: var(--ink-3); }
.o { color: var(--out-txt); }
.l { color: var(--low-txt); }
.d { color: var(--ord-txt); }
.cats.intro .cat { animation: pop .45s var(--pop) backwards; animation-delay: calc(var(--n) * 30ms); }
@keyframes pop { from { opacity: 0; transform: scale(.8) translateY(10px); } }

/* ---------- inside a section: the sections ride along the top as chips, so the next one is one tap away */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; margin-top: -6px; padding: 8px 0 8px var(--g); background: var(--canvas); }
.rail:empty { display: none; }
.chips { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 0 var(--g) 0 10px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 10px); mask-image: linear-gradient(90deg, transparent, #000 10px); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 15px 0 5px; border: 0; border-radius: 21px; background: var(--surface); font: 600 15px/1 var(--d); white-space: nowrap; }
.chip .dot { width: 32px; height: 32px; }
.chip .dot svg.i { width: 20px; height: 20px; stroke-width: 2; }
.chip.home { padding-left: 13px; color: var(--ink-2); }
.chip.on { background: var(--ink); color: #fff; }
.chip .pip { position: static; box-shadow: none; margin: 0 -6px 0 0; }
.subs { display: flex; gap: 4px; margin: 4px var(--g) 12px; padding: 4px; border-radius: 24px; background: rgba(22, 33, 27, .08); overflow-x: auto; scrollbar-width: none; }
.subs::-webkit-scrollbar { display: none; }
.subs.many { flex-wrap: wrap; border-radius: 22px; }
.sub { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: none; font: 600 15.5px/1 var(--d); color: var(--ink-2); white-space: nowrap; }
.sub span { font: 700 12px/1 var(--f); color: var(--ink-3); }
.sub[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(22, 33, 27, .2); }
.cls-h { margin: 16px calc(var(--g) + 4px) 7px; font: 600 15.5px/1.2 var(--d); color: var(--ink-2); }
.subs + .cls-h { margin-top: 2px; }
.grp-h { display: flex; align-items: center; gap: 9px; margin: 18px calc(var(--g) + 2px) 8px; padding: 0; border: 0; background: none; font: 600 16.5px/1.2 var(--d); text-align: left; }
.grp-h .dot { width: 28px; height: 28px; }
.grp-h .dot svg.i { width: 18px; height: 18px; stroke-width: 2; }
.grp-h .n { font: 700 13px/1 var(--f); color: var(--ink-3); }

/* ---------- lists: one rounded slab per group */
.rows { margin: 0 var(--g); background: var(--surface); border-radius: var(--r); overflow: hidden; }
#stockList > .rows:first-child { margin-top: 4px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 9px 0 9px 18px; border: 0; border-bottom: 1px solid var(--line-2); background: none; text-align: left; }
.row:last-child { border-bottom: 0; }
.row:active { background: #F0F5EE; }
.row .txt { flex: 1; min-width: 0; }
.row .nm { display: block; font: 700 16px/1.25 var(--f); }
.row .ds { display: block; margin-top: 2px; font: 600 13.5px/1.3 var(--f); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ds .note { color: var(--ink); font-style: italic; }
.row .okm { flex: none; display: grid; place-items: center; width: 26px; height: 26px; margin-right: 16px; border-radius: 50%; background: var(--ok-soft); color: var(--ok-txt); }
.row .okm svg.i { width: 16px; height: 16px; stroke-width: 3; }
.addrow { min-height: 54px; color: var(--pipe); }
.addrow .nm { font: 600 16px/1.2 var(--d) !important; }
.addrow .plus { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin-left: -4px; border-radius: 50%; border: 2px dashed currentColor; }
.addrow .plus svg.i { width: 16px; height: 16px; stroke-width: 3; }
.cat.add { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.cat.add .dot { background: var(--surface); color: var(--pipe); border: 2px dashed var(--pipe); }
.cat.add .dot svg.i { width: 24px; height: 24px; stroke-width: 2.6; }
.cat.add .nm { color: var(--pipe); }
.row.pending .nm::after { content: " · saving"; font-weight: 600; font-size: 13px; color: var(--ink-3); }
.row.just .flag { transform-origin: 100% 50%; animation: unfurl .5s var(--pop); }
.row.just .okm { animation: pop .45s var(--pop); }
@keyframes unfurl { from { transform: scaleX(0); } }

/* the flag: tape tied on at the row's right edge, fishtail end pointing at the item */
.flag { flex: none; display: inline-flex; align-items: center; height: 28px; padding: 0 12px 0 17px; font: 600 13.5px/1 var(--d); letter-spacing: .06em; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 8px 50%); }
.flag.out { background: var(--out); color: #fff; }
.flag.low { background: var(--low); color: var(--ink); }
.flag.ordered { background: var(--ord); color: #fff; }
.flag.ok { background: var(--ok); color: #fff; }
.flag.sm { height: 22px; font-size: 12px; padding: 0 9px 0 14px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 6px 50%); }

/* ---------- the dock: the four screens on a floating pill */
.tabs { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 25; margin: 0 auto; width: min(420px, calc(100% - 24px)); height: var(--tabs); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 6px; border-radius: 32px; background: var(--ink); box-shadow: 0 12px 24px -12px rgba(8, 28, 16, .7); }
.tabs button { position: relative; border: 0; border-radius: 26px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 12.5px/1 var(--d); color: rgba(255, 255, 255, .76); }
.tabs button[aria-selected="true"] { background: var(--hivis); color: var(--ink); }
.tabs .badge { position: absolute; top: 1px; left: calc(50% + 7px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--out); color: #fff; font: 600 13px/20px var(--d); text-align: center; box-shadow: 0 0 0 2px var(--ink); }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 24px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font: 600 16.5px/1 var(--d); color: var(--ink); text-decoration: none; text-align: center; }
.btn.go { background: var(--pipe); box-shadow: none; color: #fff; }
.btn.big { min-height: 58px; border-radius: 29px; font-size: 19px; width: 100%; }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 15px; border-radius: 20px; }
.btn.quiet { box-shadow: none; background: transparent; color: var(--ink-2); }
.btn:disabled { opacity: .5; }

/* ---------- order list */
.bar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 var(--g) 6px; }
.sup-h { display: flex; align-items: baseline; justify-content: space-between; padding: 18px calc(var(--g) + 4px) 8px; font: 600 17px var(--d); }
.sup-h span { font: 700 14px var(--f); color: var(--ink-3); }
.orow { display: flex; align-items: center; gap: 10px; padding: 11px 12px 11px 18px; border-bottom: 1px solid var(--line-2); }
.orow:last-child { border-bottom: 0; }
.orow .txt { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.orow .nm { display: block; font: 700 16px/1.25 var(--f); }
.orow .ds { display: block; margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
.orow .ds .flag { vertical-align: middle; margin-right: 6px; }
.orow .ds .note { color: var(--ink); font-style: italic; }

/* ---------- recent */
.lrow { display: flex; gap: 12px; padding: 12px 16px 12px 18px; border-bottom: 1px solid var(--line-2); }
.lrow:last-child { border-bottom: 0; }
.lrow .flag { margin-top: 2px; width: 88px; justify-content: center; padding: 0 6px 0 12px; }
.lrow .what { flex: 1; min-width: 0; font-size: 15.5px; }
.lrow .what b { font-weight: 800; }
.lrow .when { display: block; margin-top: 3px; font-size: 13.5px; color: var(--ink-3); }
.lrow .nt { display: block; margin-top: 4px; font-size: 15px; color: var(--ink-2); font-style: italic; }
.day-h { padding: 16px calc(var(--g) + 4px) 8px; font: 600 16px var(--d); color: var(--ink-2); }
.h2 + .day-h { padding-top: 0; }

/* ---------- me and people */
.card { margin: 0 var(--g) 14px; padding: 18px; background: var(--surface); border-radius: var(--r); }
.card h3 { margin: 0 0 4px; font: 600 19px/1.25 var(--d); }
.card p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.card .row-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.link-box { margin-top: 10px; padding: 11px 14px; border-radius: 16px; background: var(--canvas); font: 700 13.5px/1.35 var(--f); word-break: break-all; user-select: all; -webkit-user-select: all; }
.field { display: grid; gap: 6px; margin-top: 12px; }
.field > span { font: 700 14px var(--f); color: var(--ink-2); }
.field input, .field select, .note-in { width: 100%; height: 50px; border: 2px solid var(--line); border-radius: 25px; background: var(--surface); padding: 0 18px; font-size: 16.5px; }
.check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--pipe); }
.prow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line-2); }
.prow:first-of-type { border-top: 0; }
.prow .who { flex: 1; min-width: 0; }
.prow .who b { display: block; font: 600 17.5px var(--d); }
.prow .who span { font-size: 14px; color: var(--ink-3); }
.role { display: inline-block; padding: 3px 9px; border-radius: 10px; font: 700 12px/1.2 var(--f); background: var(--canvas); color: var(--ink-2); }
.role.off { background: var(--out-soft); color: var(--out-txt); }
.tip { margin: 0 var(--g) 14px; padding: 15px 18px; border-radius: var(--r); background: var(--ok-soft); color: #1F3D29; font-size: 15px; }
.tip b { font-weight: 800; }
.warn-line { color: var(--out-txt); font-weight: 700; }

/* ---------- item sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 22, 15, .55); animation: fade .2s ease-out; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 30px 30px 0 0; padding: 0 18px calc(20px + env(safe-area-inset-bottom)); animation: rise .32s cubic-bezier(.2, .9, .3, 1); }
@keyframes rise { from { transform: translateY(55%); } }
@keyframes fade { from { opacity: 0; } }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 9px auto 4px; }
.sh-top { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0 4px; }
.sh-top .t { flex: 1; min-width: 0; }
.sh-top h2 { margin: 0; font: 600 23px/1.2 var(--d); }
.sh-top p { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.x-btn { flex: none; width: 44px; height: 44px; margin: -2px -6px 0 0; border: 0; border-radius: 22px; background: var(--canvas); display: grid; place-items: center; color: var(--ink-2); }
.now-line { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; font-size: 15px; color: var(--ink-2); }
.now-line .nt { display: block; color: var(--ink); font-style: italic; }
.sh-h { margin: 18px 0 8px; font: 800 14.5px/1.2 var(--f); color: var(--ink-2); }
.note-in { height: 48px; font-size: 16px; margin-bottom: 10px; }
.marks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mark { position: relative; min-height: 76px; padding: 10px 14px; border-radius: 26px; border: 2px solid; background: var(--surface); display: flex; flex-direction: column; justify-content: center; gap: 3px; text-align: left; font: 600 20px/1.05 var(--d); }
.mark small { display: block; font: 700 13.5px/1.2 var(--f); color: var(--ink-2); }
.mark.ic { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; padding-left: 10px; }
.mark .mi { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: currentColor; }
.mark .mi svg.i { stroke: #fff; stroke-width: 2.4; }
.mark .mt { min-width: 0; }
.mark .mt small { margin-top: 3px; }
.mark.out { border-color: var(--out); color: var(--out-txt); }
.mark.low { border-color: var(--low); color: var(--low-txt); }
.mark.ordered { border-color: var(--ord); color: var(--ord-txt); }
.mark.ok { border-color: var(--ok); color: var(--ok-txt); }
.mark.now { color: #fff; }
.mark.now small { color: inherit; opacity: .92; }
.mark.out.now { background: var(--out); }
.mark.low.now { background: var(--low); color: var(--ink); }
.mark.ordered.now { background: var(--ord); }
.mark.ok.now { background: var(--ok); }
.mark.now .mi { background: rgba(255, 255, 255, .24); }
.mark.low.now .mi { background: rgba(22, 33, 27, .14); }
.mark.low.now .mi svg.i { stroke: var(--ink); }
.mark.now::after { content: "Now"; position: absolute; top: -10px; right: 18px; font: 800 11px/1 var(--f); padding: 4px 8px; border-radius: 9px; background: var(--ink); color: #fff; }
.mark:disabled { opacity: .55; }
.done { margin: 14px 0 4px; padding: 18px; border-radius: var(--r); background: var(--canvas); }
.done .hd { display: flex; align-items: center; gap: 10px; font: 600 20px/1.2 var(--d); }
.done p { margin: 10px 0 12px; font-size: 15px; color: var(--ink-2); }
.done .msg { margin: 12px 0 0; padding: 11px 15px; background: var(--surface); border-radius: 20px 20px 20px 6px; font-size: 15px; color: var(--ink); white-space: pre-wrap; }
.done .acts { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
.count { display: flex; align-items: center; gap: 8px; }
.step { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--canvas); font: 600 28px/1 var(--d); display: grid; place-items: center; }
.count input { width: 96px; height: 54px; border: 2px solid var(--line); border-radius: 27px; text-align: center; font: 600 24px var(--d); }
.count .unit { font-size: 15px; color: var(--ink-2); min-width: 0; }
.count-acts { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.small-note { font-size: 14px; color: var(--ink-3); margin-top: 6px; }
.facts { margin: 20px 0 0; padding: 14px 16px; border-radius: 20px; background: var(--canvas); display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; font-size: 14.5px; }
.facts dt { color: var(--ink-3); font-weight: 700; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts a { font-weight: 800; }

/* ---------- sign in */
.signin { max-width: 440px; margin: 0 auto; padding: 28px 18px; }
.signin h2 { font: 700 28px/1.2 var(--d); margin: 0 0 6px; }
.signin p { color: var(--ink-2); margin: 0 0 16px; }
.signin input { width: 100%; height: 58px; border: 2px solid var(--line); border-radius: 29px; padding: 0 16px; font: 600 26px var(--d); letter-spacing: .12em; text-transform: uppercase; text-align: center; background: var(--surface); }
.signin .btn { margin-top: 12px; }

/* ---------- toast */
.toast { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs) + 22px + env(safe-area-inset-bottom)); z-index: 60; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 18px; border-radius: 26px; background: var(--ink); color: #fff; font: 700 14.5px/1.3 var(--f); box-shadow: 0 10px 22px -10px rgba(8, 28, 16, .7); animation: pop .3s var(--pop); }
.toast:empty { display: none; }
.toast button { border: 0; background: none; color: var(--hivis); font: 600 16px var(--d); padding: 4px 2px; }

/* ---------- QR reports waiting for the owner */
.qr { margin: 0 var(--g) 14px; padding: 16px 18px; background: var(--surface); border-radius: var(--r); box-shadow: inset 0 0 0 2px var(--low); }
.qr h3 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 600 19px/1.25 var(--d); }
.qr h3 span { font: 700 14px var(--f); color: var(--ink-3); }
.qr > p { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.qr-row { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line-2); }
.qr h3 + p + .qr-row, .qr h3 + .qr-row { margin-top: 10px; }
.qr-top { display: flex; align-items: center; gap: 10px; font-size: 16.5px; }
.qr-top b { min-width: 0; font-weight: 800; overflow-wrap: anywhere; }
.qr-note { font-size: 15px; font-style: italic; overflow-wrap: anywhere; }
.qr-sub, .qr-eff { font-size: 14px; color: var(--ink-2); }
.qr-eff.stale { color: var(--out-txt); font-weight: 700; }
.qr-count { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--ink); color: #fff; font: 600 12.5px/1 var(--d); letter-spacing: .05em; }
.qr .row-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.qr details { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.qr details summary { cursor: pointer; padding: 4px 0; font-weight: 800; }
.qr-old { padding: 6px 0; border-top: 1px solid var(--line-2); }
.qr.in-sheet { margin: 14px 0 0; background: var(--low-soft); box-shadow: none; }
.qr-tag { flex: none; margin-right: -4px; padding: 3px 7px; border-radius: 9px; background: var(--low-soft); color: var(--low-txt); font: 600 12px/1 var(--d); letter-spacing: .05em; }

/* ---------- wider screens: the item opens as a panel in the middle */
@media (min-width: 760px) {
  .cats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sheet { left: 50%; right: auto; top: 50%; bottom: auto; width: 540px; max-height: 88vh; border-radius: 30px; transform: translate(-50%, -50%); animation: fade .2s ease-out; padding-bottom: 22px; }
  .grab { display: none; }
  .sh-top { padding-top: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.install { margin: 0 var(--g) 14px; padding: 16px 18px; border-radius: var(--r); background: var(--ok-soft); color: #1F3D29; font-size: 15px; }
.install b { font-weight: 800; }
.install ol { margin: 8px 0 0; padding-left: 22px; }
.install li { margin: 4px 0; }
.install .os { margin-top: 10px; font: 600 16px/1.2 var(--d); color: var(--ink); }
.install .btn { margin-top: 12px; }
.share-i { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; }
</style>
</head>

<script>window.BOOT = null;</script>

<script>
(function () {
  "use strict";
  // Ellsworth Materials: the crew marks items Out, Low, Ordered or In stock; the labels land in the
  // master sheet's Stock Status column. Saves made with no signal wait on the phone and go out later.
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const POLL_MS = 30000;
  const ST = {
    OUT: { cls: "out", flag: "OUT", word: "Out", hint: "None left" },
    LOW: { cls: "low", flag: "LOW", word: "Low", hint: "Order soon" },
    ORDERED: { cls: "ordered", flag: "ORDERED", word: "Ordered", hint: "On the way" },
    OK: { cls: "ok", flag: "OK", word: "In stock", hint: "Plenty here" }
  };
  const MARK_ORDER = ["OUT", "LOW", "ORDERED", "OK"];
  const SUPPLIER_ORDER = ["FW Webb", "Polylok", "Pallette Stone"];
  const ICON = {
    stock: '<path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>',
    order: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 11h6M9 15h4"/>',
    recent: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4.4-6 8-6s6.6 2 8 6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    chev: '<path d="m6 9 6 6 6-6"/>',
    text: '<path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.6L3.5 21l1.4-4.4A8.5 8.5 0 1 1 20.5 12z"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    grid: '<circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
    down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    truck: '<path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/>'
  };
  const MARK_ICON = { OUT: "x", LOW: "down", ORDERED: "truck", OK: "check" };
  // What goes on a section's dot: a riser, a stick of pipe, an elbow, a tee, a Fernco, a roll of fabric,
  // a can of marking paint, a stake with a ribbon on it, a battery, a marker, a tied bag, a glue can.
  const PIC = {
    riser: '<ellipse cx="12" cy="8" rx="8" ry="3.4"/><ellipse cx="12" cy="8" rx="4.4" ry="1.4"/><path d="M4 8v8.2c0 1.9 3.6 3.4 8 3.4s8-1.5 8-3.4V8"/>',
    pipe: '<ellipse cx="6" cy="12" rx="3" ry="6"/><path d="M6 6h12c1.7 0 3 2.7 3 6s-1.3 6-3 6H6"/>',
    elbow: '<path d="M3 5h8a8 8 0 0 1 8 8v8M3 11h8a2 2 0 0 1 2 2v8M3 5v6M13 21h6"/>',
    tee: '<path d="M2 5h20v7h-6v9H8v-9H2z"/>',
    coupling: '<rect x="6" y="5" width="12" height="14" rx="2.5"/><path d="M10 5v14M14 5v14M2 8.5h4M2 15.5h4M18 8.5h4M18 15.5h4"/>',
    roll: '<circle cx="8" cy="9" r="5"/><circle cx="8" cy="9" r="1.2"/><path d="M8 14h13v6H11"/>',
    spray: '<rect x="7" y="9" width="10" height="12" rx="2"/><path d="M9.5 9V7.5a2.5 2.5 0 0 1 5 0V9M11 5V3.5h2M17 3.5h.01M20 2.5h.01M20 5.5h.01"/>',
    stake: '<path d="M9 3h6v11l-3 7-3-7z"/><path d="M15 5.5h5l-1.6 2 1.6 2h-5"/>',
    battery: '<rect x="2.5" y="7.5" width="17" height="9" rx="2.5"/><path d="M22 10.5v3M6.5 12h3M8 10.5v3M13.5 12h2.5"/>',
    marker: '<path d="m13.5 3.5 7 7L12 19l-7-7zM6.5 13.5l-3 7 7-3M10.5 6.5l7 7"/>',
    bag: '<path d="M8.5 8.5c-2.5 2-4 5-4 8 0 3 3 4.5 7.5 4.5s7.5-1.5 7.5-4.5c0-3-1.5-6-4-8zM9.5 8.5 8 3.5l4 2 4-2-1.5 5"/>',
    can: '<path d="M6 10h12v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM8.5 10V6.5h7V10M10.5 6.5V3.5h3v3"/><path d="M12 13.2c1 1.2 1.7 2.1 1.7 3a1.7 1.7 0 0 1-3.4 0c0-.9.7-1.8 1.7-3z"/>',
    box: '<path d="m3 8 9-5 9 5v8l-9 5-9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>'
  };
  const pic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (PIC[n] || PIC.box) + "</svg>";
  const icon = (n, cls) => '<svg class="i' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + "</svg>";

  const S = {
    me: { name: "", role: "", code: "", isOwner: false, fromUrl: false },
    signedIn: false, readOnly: false, signinMsg: "", checking: false,
    tab: "stock", q: "", filter: "", cat: null, sub: new Map(), intro: true, introT: null, flash: null,
    open: null, done: null, editPerson: null, newPerson: null,
    items: new Map(), sections: [], log: [], people: [], alerts: [], appUrl: "", scans: []
  };
  // What the server last sent, plus saves made on this phone that haven't reached the server yet.
  const D = { installEvt: null, state: null, hash: "", loaded: false, outbox: [], inflight: new Set(), busy: false, again: null, fails: 0, offline: false, lastOk: 0, timer: null };

  // ---------------------------------------------------------------- small helpers
  // The preview keeps nothing between visits, so it never replays taps from an earlier look.
  const NOSTORE = !!window.__NO_STORE;
  function lsGet(k, d) { if (NOSTORE) return d; try { const v = localStorage.getItem("ellmat." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { if (NOSTORE) return; try { localStorage.setItem("ellmat." + k, JSON.stringify(v)); } catch (e) { /* this phone's convenience only */ } }
  function lsDel(k) { if (NOSTORE) return; try { localStorage.removeItem("ellmat." + k); } catch (e) { /* ignore */ } }
  const normCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const fmtCode = c => (c && c.length === 6 ? c.slice(0, 3) + "-" + c.slice(3) : c || "");
  const firstName = n => String(n || "").trim().split(/\s+/)[0] || "";
  const normStatus = s => { s = String(s || "").trim().toUpperCase(); return ST[s] ? s : "OK"; };
  const num = v => (v === "" || v === null || v === undefined || isNaN(Number(v)) ? null : Number(v));
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  // Same rule as the server: a count of 0 is OUT, at or under the Low at number is LOW, over it is OK.
  // Something already ORDERED stays ORDERED until a count shows it came in.
  function statusFromCount(cur, qty, lowAt) {
    cur = normStatus(cur);
    if (qty <= 0) return cur === "ORDERED" ? "ORDERED" : "OUT";
    if (lowAt !== null && lowAt !== undefined) return qty <= lowAt ? (cur === "ORDERED" ? "ORDERED" : "LOW") : "OK";
    return cur === "OUT" ? "OK" : cur;
  }

  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function timeText(ms) {
    const d = new Date(ms);
    let h = d.getHours(), m = d.getMinutes();
    const ap = h < 12 ? "AM" : "PM";
    h = h % 12 || 12;
    return h + ":" + String(m).padStart(2, "0") + " " + ap;
  }
  function dayText(ms, withYear) {
    const d = new Date(ms), now = new Date();
    if (sameDay(d, now)) return "Today";
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (sameDay(d, y)) return "Yesterday";
    const wk = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
    return wk + ", " + mo + " " + d.getDate() + (withYear && d.getFullYear() !== now.getFullYear() ? ", " + d.getFullYear() : "");
  }
  function whenText(ms) {
    if (!ms) return "";
    const day = dayText(ms, true);
    return (day === "Today" ? "today" : day === "Yesterday" ? "yesterday" : day) + " " + timeText(ms);
  }
  function whoText(by, mid) {
    if (!by) return mid ? "someone" : "Someone";
    if (S.me.name && by === S.me.name) return mid ? "you" : "You";
    return firstName(by);
  }
  function money(v) { const n = num(v); return n === null ? "" : "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  // ---------------------------------------------------------------- search
  // "4 90" finds 4" 90s without matching Sch 40; "tee", "wye", "light duty" and "sch 40" all work.
  function norm(s) {
    return String(s || "").toLowerCase()
      .replace(/½/g, ".5").replace(/°/g, " ")
      .replace(/(\d)\s*(?:"|”|''|in\b|inch(?:es)?\b)/g, "$1in ")
      .replace(/(\d)\s*(?:'|’|ft\b|foot\b|feet\b)/g, "$1ft ")
      .replace(/\bsch(?:edule)?\s*40\b/g, "sch40")
      .replace(/\bsdr\s*(\d+)/g, "sdr$1")
      .replace(/\blight\s*duty\b/g, "ld")
      .replace(/\btees?\b/g, "t").replace(/\bwyes?\b/g, "y")
      .replace(/\b22(?:\.5| 1\/2)\b/g, "22")
      .replace(/[^a-z0-9.]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function hay(it) {
    if (it._hay) return it._hay;
    const extra = [];
    const ty = String(it.type || "").toLowerCase();
    if (/bend/.test(ty)) extra.push("elbow ell bend fitting");
    if (/directional/.test(ty)) extra.push("tee wye sanitary combo");
    if (/\bcap\b/.test(ty)) extra.push("end cap plug");
    if (/coupling/.test(ty)) extra.push("coupling rubber boot");
    if (/riser/.test(ty)) extra.push("riser ring septic");
    if (/cover/.test(ty)) extra.push("lid cover");
    if (/fabric/.test(ty)) extra.push("geotextile cloth");
    const text = [it.name, it.nick, it.desc, it.id, it.type, it.spec, it.size, it.brand, it.cat, it.supplier, it.webb, it.mfr, it.loc, extra.join(" ")].join(" ");
    const toks = norm(text).split(" ").filter(Boolean);
    it._hay = { toks: toks, set: new Set(toks) };
    return it._hay;
  }
  function matches(it, q) {
    const qt = norm(q).split(" ").filter(Boolean);
    if (!qt.length) return true;
    const h = hay(it);
    return qt.every(t => {
      if (/^\d+(\.\d+)?$/.test(t)) return h.set.has(t) || h.set.has(t + "in") || h.set.has(t + "ft");
      const alt = t.length > 3 && t.endsWith("s") ? t.slice(0, -1) : null;
      return h.toks.some(w => w.startsWith(t) || (alt && w.startsWith(alt)));
    });
  }

  // ---------------------------------------------------------------- talking to the sheet
  function rpc(req) {
    return new Promise((resolve, reject) => {
      if (window.__MOCK_API) {
        setTimeout(() => { try { resolve(JSON.parse(window.__MOCK_API(JSON.stringify(req)))); } catch (e) { reject(e); } }, 120);
        return;
      }
      const API = window.MAT_CONFIG && window.MAT_CONFIG.api;
      if (API && !(window.google && google.script && google.script.run)) {
        const ctl = typeof AbortController === "function" ? new AbortController() : null;
        const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 40000);
        fetch(API + "?api=" + encodeURIComponent(JSON.stringify(req)) + "&t=" + Date.now(), { credentials: "omit", cache: "no-store", redirect: "follow", signal: ctl ? ctl.signal : undefined })
          .then(r => r.text().then(t => {
            try { resolve(JSON.parse(t)); }
            catch (e) { const err = new Error(r.ok ? "The sheet sent back something unexpected." : "The sheet answered with error " + r.status + "."); err.server = true; reject(err); }
          }))
          .catch(reject)
          .finally(() => clearTimeout(timer));
        return;
      }
      if (!(window.google && google.script && google.script.run)) {
        const e = new Error("Open the app from its link to sign in.");
        e.noGas = true;
        reject(e);
        return;
      }
      google.script.run
        .withSuccessHandler(t => { try { resolve(typeof t === "string" ? JSON.parse(t) : t); } catch (e) { reject(e); } })
        .withFailureHandler(reject)
        .api(req);
    });
  }

  function saveOutbox() { if (S.me.code) lsSet("outbox." + S.me.code, D.outbox); }
  function loadOutbox() {
    const saved = lsGet("outbox." + S.me.code, []);
    D.outbox = Array.isArray(saved) ? saved.filter(op => op && op.id && op.t) : [];
  }
  function schedule(ms) { clearTimeout(D.timer); D.timer = setTimeout(() => sync(), ms); }
  function kick() { schedule(120); }
  function queue(op) {
    op.id = newId();
    op.at = Date.now();
    D.outbox.push(op);
    saveOutbox();
    derive();
    render();
    kick();
    return op;
  }

  async function sync(opts) {
    opts = opts || {};
    if (!S.me.code) return;
    if (D.busy) { D.again = Object.assign(D.again || {}, opts); return; }
    if (!opts.full && document.visibilityState === "hidden" && !D.outbox.length) { schedule(POLL_MS); return; }
    D.busy = true;
    const ops = [];
    for (const op of D.outbox.slice(0, 40)) {
      if (ops.length && encodeURIComponent(JSON.stringify(ops.concat([op]))).length > 5000) break;
      ops.push(op);
    }
    ops.forEach(op => D.inflight.add(op.id));
    const req = { key: S.me.code, have: opts.full || !D.loaded ? "" : D.hash, ops: ops };
    let res = null, failed = null;
    try { res = await rpc(req); } catch (e) { failed = e; }
    D.busy = false;
    D.inflight.clear();
    if (failed && failed.server) {
      toast(failed.message + " The app will try again.");
      schedule(POLL_MS);
      return;
    }
    if (failed) {
      D.fails++;
      D.offline = true;
      renderChrome();
      if (failed.noGas) { S.signinMsg = failed.message; if (!S.signedIn) render(); return; }
      schedule(Math.min(60000, 4000 * D.fails));
      return;
    }
    D.fails = 0; D.offline = false; D.fromCache = false; D.lastOk = Date.now();
    if (!res || !res.ok) {
      const err = res && res.error;
      if (err === "bad_key") return signOut(S.signedIn ? "Your link was turned off. Ask Charlie for a new one." : "That code isn't turned on. Check it, or ask Charlie for a new one.");
      if (err === "busy") { schedule(2500); return; }
      toast("The sheet had a problem: " + ((res && res.message) || "unknown error") + ". The app will try again.");
      schedule(POLL_MS);
      return;
    }
    const wasSignedIn = S.signedIn;
    acceptMe(res.me);
    const finished = new Set((res.applied || []).concat((res.rejected || []).map(r => r.id)));
    if (finished.size) { D.outbox = D.outbox.filter(op => !finished.has(op.id)); saveOutbox(); }
    (res.rejected || []).forEach(r => toast("Couldn't save one change: " + r.why));
    if (res.state) { D.state = res.state; D.loaded = true; }
    if (res.hash) D.hash = res.hash;
    saveCache();
    derive();
    render(true);
    if (!wasSignedIn && S.signedIn) onSignedIn();
    if (D.again) { const o = D.again; D.again = null; sync(o); return; }
    schedule(D.outbox.length ? 400 : POLL_MS);
  }

  // Owner-only changes (people, phones) go straight to the sheet instead of waiting on the phone.
  async function sendNow(op) {
    op.id = newId();
    op.at = Date.now();
    let res;
    try { res = await rpc({ key: S.me.code, have: "", ops: [op] }); }
    catch (e) { toast("No connection. Try again when you have signal."); return null; }
    if (!res || !res.ok) { toast(res && res.error === "bad_key" ? "Your link was turned off." : "The sheet had a problem. Try again."); return null; }
    const rej = (res.rejected || []).find(r => r.id === op.id);
    if (rej) { toast(rej.why); return null; }
    acceptMe(res.me);
    if (res.state) { D.state = res.state; D.loaded = true; }
    if (res.hash) D.hash = res.hash;
    derive();
    render();
    return res;
  }

  // The last list the sheet sent, kept on this phone so the app opens with no signal.
  function saveCache() {
    if (S.me.code && D.state) lsSet("cache." + S.me.code, { state: D.state, hash: D.hash, me: { name: S.me.name, role: S.me.role, code: S.me.code }, at: D.lastOk || Date.now() });
  }
  function loadCache(code) {
    const c = lsGet("cache." + code, null);
    return c && c.state && c.me && c.me.code === code ? c : null;
  }
  function acceptMe(me) {
    if (!me) return;
    S.me.name = me.name; S.me.role = me.role; S.me.code = me.code || S.me.code;
    S.me.isOwner = me.role === "Owner";
    S.readOnly = me.role === "View only";
    S.signedIn = true;
    lsSet("code", S.me.code);
    // The QR pages by the materials read this, so what this person sends from a scan shows their real name.
    lsSet("scanWho", { code: S.me.code, name: S.me.name, role: S.me.role });
  }

  function signOut(msg) {
    lsDel("code");
    lsDel("scanWho");
    if (S.me.code) { lsDel("outbox." + S.me.code); lsDel("cache." + S.me.code); }
    clearTimeout(D.timer);
    S.signedIn = false; S.me = { name: "", role: "", code: "", isOwner: false, fromUrl: false };
    S.signinMsg = msg || ""; S.open = null; S.done = null; S.cat = null; S.filter = "";
    D.outbox = []; D.loaded = false; D.state = null; D.hash = "";
    derive();
    render();
  }

  function onSignedIn() {
    if (!S.me.fromUrl) toast(standalone() ? "You're in." : "You're in. Open Me to put the app on your home screen.");
  }

  // ---------------------------------------------------------------- state the screens draw from
  function derive() {
    const st = D.state || { items: [], sections: [], log: [], people: [], alerts: [], appUrl: "" };
    const items = new Map();
    (st.items || []).forEach(it => items.set(it.key, Object.assign({}, it, { status: normStatus(it.status), pending: false, _hay: null })));
    const log = (st.log || []).slice();
    const sdec = new Map();
    D.outbox.forEach(op => { if (op.t === "scan") sdec.set(op.rid, op.act === "ok" ? "ok" : "no"); });
    S.scans = (st.scans || []).map(r => (r.status === "wait" && sdec.has(r.id) ? Object.assign({}, r, { status: sdec.get(r.id), pending: true }) : r));
    for (const op of D.outbox) {
      const it = op.key ? items.get(op.key) : null;
      if (!it) continue;
      if (op.t === "status") {
        const from = it.status;
        it.status = normStatus(op.to); it.by = S.me.name; it.when = op.at; it.note = op.note || ""; it.pending = true;
        log.unshift({ at: op.at, key: it.key, name: it.name, from: from, to: it.status, by: S.me.name, note: op.note || "", pending: true });
      } else if (op.t === "count") {
        const from = it.status;
        it.qty = op.qty; it.counted = op.at; it.pending = true;
        it.status = statusFromCount(from, op.qty, num(it.lowAt));
        if (it.status !== from) { it.by = S.me.name; it.when = op.at; it.note = ""; }
        log.unshift({ at: op.at, key: it.key, name: it.name, from: from, to: it.status, qty: op.qty, by: S.me.name, note: "", pending: true });
      } else if (op.t === "lowAt") {
        it.lowAt = op.value; it.pending = true;
      }
    }
    const secs = (st.sections || []).slice();
    const maxOrder = (cat, spec) => { let m = -1, any = -1; items.forEach(x => { if (x.cat === cat) { any = Math.max(any, x.order); if (!spec || x.spec === spec) m = Math.max(m, x.order); } }); return m >= 0 ? m : any >= 0 ? any : 1e6; };
    for (const op of D.outbox) {
      if (op.t === "group+" && !secs.some(s => s.cat.toLowerCase() === String(op.cat).toLowerCase())) secs.push({ cat: op.cat, pending: true });
      if (op.t === "item+") items.set("new-" + op.id, { key: "new-" + op.id, id: "", cat: op.cat, spec: op.spec || "", tab: op.tab || "", name: op.desc, desc: op.desc, nick: op.nick || "", unit: op.unit || "", supplier: op.supplier || "", status: "OK", order: maxOrder(op.cat, op.spec) + 0.001 * (D.outbox.indexOf(op) + 1), pending: true, adding: true, _hay: null });
    }
    S.items = items;
    S.sections = secs;
    S.log = log;
    S.people = st.people || [];
    S.alerts = st.alerts || [];
    S.appUrl = st.appUrl || "";
  }

  const itemsInOrder = () => [...S.items.values()].sort((a, b) => a.order - b.order);
  const needsOrder = it => it.status === "OUT" || it.status === "LOW";

  // People who should get a text when something runs low, other than whoever is marking it.
  function textTargets() { return S.alerts.filter(a => a.name !== S.me.name); }
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function smsHref(people, body) {
    const nums = people.map(p => String(p.phone || "").replace(/[^\d+]/g, "")).filter(Boolean);
    const b = encodeURIComponent(body);
    if (!nums.length) return "sms:?&body=" + b;
    if (isIOS()) return nums.length > 1 ? "sms://open?addresses=" + nums.join(",") + "&body=" + b : "sms:" + nums[0] + "&body=" + b;
    return "sms:" + nums.join(",") + "?body=" + b;
  }
  function namesText(people) {
    const n = people.map(p => firstName(p.name));
    return n.length <= 2 ? n.join(" & ") : n.slice(0, -1).join(", ") + " & " + n[n.length - 1];
  }
  function alertText(it, to, note, qty) {
    let s = to + ": " + it.name;
    if (it.desc && it.desc.toLowerCase() !== it.name.toLowerCase()) s += " (" + it.desc + ")";
    s += ".";
    if (qty !== undefined && qty !== null && qty > 0) s += " " + qty + " " + unitWord(it.unit, qty) + " left.";
    if (note) s += " " + note + (/[.!?]$/.test(note) ? "" : ".");
    s += " - " + (firstName(S.me.name) || "Crew");
    return s.replace(/\s+\./g, ".").replace(/ {2,}/g, " ");
  }

  // ---------------------------------------------------------------- drawing
  function render(fromSync) {
    renderChrome();
    if (!S.signedIn) { renderSignin(); closeSheetDom(); return; }
    if (S.tab === "stock") renderStock();
    if (S.tab === "order") renderOrder();
    if (S.tab === "recent") renderRecent();
    if (S.tab === "me" && !(fromSync && typingIn("#v-me"))) renderMe();
    if (fromSync && typingIn("#sheet")) return;
    renderSheet();
  }
  function typingIn(sel) {
    const a = document.activeElement, box = $(sel);
    return !!(a && box && box.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }

  function renderChrome() {
    const signed = S.signedIn;
    $("#signin").hidden = signed;
    $("#main").hidden = !signed;
    $("#tabs").hidden = !signed;
    ["stock", "order", "recent", "me"].forEach(t => {
      const b = $("#tab-" + t);
      b.setAttribute("aria-selected", String(S.tab === t));
      $("#v-" + t).hidden = S.tab !== t;
    });
    let toOrder = 0;
    S.items.forEach(it => { if (needsOrder(it)) toOrder++; });
    const badge = $("#orderBadge");
    badge.textContent = toOrder ? String(toOrder) : "";
    badge.hidden = !toOrder;
    const sy = $("#sync");
    const waiting = D.outbox.length;
    sy.className = "sync";
    if (!signed) sy.textContent = "";
    else if (D.offline && waiting) { sy.textContent = "No signal · " + waiting + " waiting"; sy.classList.add("off"); }
    else if (D.offline) { sy.textContent = "No signal"; sy.classList.add("off"); }
    else if (waiting) { sy.textContent = "Saving…"; sy.classList.add("saving"); }
    else sy.textContent = D.loaded ? (D.fromCache ? "Checking…" : "Up to date") : "Loading…";
  }

  function renderSignin() {
    const el = $("#signin");
    if (S.checking) { el.innerHTML = '<div class="signin"><h2>Signing you in…</h2></div>'; return; }
    el.innerHTML = `<form class="signin" data-form="signin" autocomplete="off">
      <h2>Sign in</h2>
      <p>Type the 6-letter code from your link. Charlie can send you one.</p>
      <label class="sr" for="codeIn">Your code</label>
      <input id="codeIn" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="ABC-123" required>
      <p class="warn-line" id="signinWarn" ${S.signinMsg ? "" : "hidden"}>${esc(S.signinMsg)}</p>
      <button class="btn go big" type="submit">Sign in</button>
    </form>`;
  }

  // ---------- Stock: a button for every section, the items in one section, or whatever a search or a
  // strip of tape turned up
  // Redraws a block only when what it shows has changed, so a background check for news doesn't
  // restart an animation or lose where the row of chips was scrolled to.
  function html(el, s) { if (el.__h === s) return false; el.innerHTML = s; el.__h = s; return true; }

  // A section's picture and dot color come from the words in its name. A section the sheet gains
  // later still gets a dot: the box, in a color picked from its name.
  const SIZE_COLOR = { 4: "#0F8B8D", 6: "#5661D8" };
  const SPARE = ["#0F8B8D", "#5661D8", "#3F7CAC", "#7647C9", "#B9813D", "#6E7F2F", "#5C7080", "#2F8F4E"];
  const KINDS = [
    [/riser|lid|septic|tank/i, "riser", "#2F8F4E"],
    [/misc/i, "tee", "#3F7CAC"],
    [/fitting|elbow|bend/i, "elbow", ""],
    [/pipe/i, "pipe", ""],
    [/fernco|coupling/i, "coupling", "#5C7080"],
    [/fabric|geotextile/i, "roll", "#7A6A55"],
    [/paint/i, "spray", "#EA2E8B"],
    [/stake|lath/i, "stake", "#B9813D"],
    [/batter/i, "battery", "#F2B711", "#16211B"],
    [/marker|sharpie/i, "marker", "#25282D"],
    [/trash|bag/i, "bag", "#6E7F2F"],
    [/glue|primer|cement|lube/i, "can", "#7647C9"]
  ];
  const metaCache = new Map();
  function catMeta(cat) {
    if (metaCache.has(cat)) return metaCache.get(cat);
    const k = KINDS.find(r => r[0].test(cat));
    let color = k && k[2];
    if (!color) {
      let h = 0;
      for (const ch of cat) h = (h * 31 + ch.charCodeAt(0)) % 997;
      color = (k && SIZE_COLOR[parseFloat(cat)]) || SPARE[h % SPARE.length];
    }
    const m = { pic: k ? k[1] : "box", style: "--c:" + color + (k && k[3] ? ";--ci:" + k[3] : "") };
    metaCache.set(cat, m);
    return m;
  }
  function dot(cat, extra) { const m = catMeta(cat); return `<span class="dot" style="${m.style}">${pic(m.pic)}${extra || ""}</span>`; }
  function tallyOf(list) {
    const c = { n: 0, OUT: 0, LOW: 0, ORDERED: 0 };
    list.forEach(it => { c.n++; if (c[it.status] !== undefined) c[it.status]++; });
    return c;
  }
  const inCat = (all, cat) => all.filter(it => it.cat === cat);
  const sumHtml = c => [c.OUT ? `<span class="o">${c.OUT} out</span>` : "", c.LOW ? `<span class="l">${c.LOW} low</span>` : "", c.ORDERED ? `<span class="d">${c.ORDERED} ordered</span>` : ""].filter(Boolean).join(", ") || plural(c.n, "item");
  const pip = c => (c.OUT + c.LOW ? `<i class="pip${c.OUT ? "" : " low"}">${c.OUT + c.LOW}</i>` : "");

  // A long section splits into tabs by class (LD, Sch 40, SDR 35) when every item in it has one.
  function classTabs(items) {
    if (items.some(it => it.tab)) { const t = new Map(); for (const it of items) { const k = it.tab || "Other"; t.set(k, (t.get(k) || 0) + 1); } return t.size > 1 ? [...t.entries()] : []; }
    if (items.length < 8) return [];
    const by = new Map();
    for (const it of items) { if (!it.spec) return []; by.set(it.spec, (by.get(it.spec) || 0) + 1); }
    return by.size > 1 && by.size < 6 ? [...by.entries()] : [];
  }

  function renderStock() {
    const all = itemsInOrder();
    const q = S.q.trim();
    if (S.cat && !S.sections.some(s => s.cat === S.cat)) S.cat = null;      // renamed or gone from the sheet
    const mode = q || S.filter ? "find" : S.cat ? "cat" : "home";
    html($("#qrBox"), mode === "home" ? qrCard() : "");
    const counts = tallyOf(all);
    html($("#tally"), mode === "cat" || !all.length || (q && !S.filter) ? "" : counts.OUT + counts.LOW + counts.ORDERED || S.filter
      ? ["OUT", "LOW", "ORDERED"].filter(k => counts[k] || S.filter === k).map(k => {
        const label = counts[k] + " " + ST[k].word.toLowerCase() + (S.filter === k ? ", showing only these" : "");
        return `<button type="button" class="tape ${ST[k].cls}" data-action="filter" data-st="${k}" aria-pressed="${S.filter === k}" aria-label="${esc(label)}"><b>${counts[k]}</b>${ST[k].flag}</button>`;
      }).join("")
      : `<span class="allgood">${icon("check")}Everything's in stock</span>`);
    const rail = $("#rail");
    if (html(rail, mode === "cat" ? railHtml(all) : "") && mode === "cat") {
      const on = $(".chip.on", rail), box = $(".chips", rail);
      if (on) box.scrollLeft = on.offsetLeft - box.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;
    }
    const note = $("#filterNote"), body = $("#stockList");
    note.hidden = mode !== "find";
    if (!all.length) { html(body, `<div class="empty"><b>No items yet.</b>Items show up here from the Materials tab of the master sheet.</div>`); return; }
    if (mode === "home") {
      html(body, tilesHtml(all));
      if (S.intro && !S.introT) S.introT = setTimeout(() => { S.intro = false; }, 1200);
      return;
    }
    if (mode === "cat") { html(body, catHtml(inCat(all, S.cat))); return; }
    const list = all.filter(it => (!S.filter || it.status === S.filter) && (!q || matches(it, q)));
    note.innerHTML = `<span>${plural(list.length, "item")} ${S.filter ? "marked " + ST[S.filter].flag : "found"}</span><button type="button" class="link-btn" data-action="clear">Show everything</button>`;
    if (!list.length) {
      html(body, q ? `<div class="empty"><b>Nothing matches “${esc(q)}”.</b>Try fewer words, a size like 4 or 6, or a part number.</div>`
        : `<div class="empty"><b>Nothing is marked ${esc(ST[S.filter].flag)}.</b>Tap the tape again to see everything.</div>`);
      return;
    }
    const groups = new Map();
    list.forEach(it => { if (!groups.has(it.cat)) groups.set(it.cat, []); groups.get(it.cat).push(it); });
    html(body, [...groups.entries()].map(([cat, items]) => `<section>
        <button type="button" class="grp-h" data-action="cat" data-cat="${esc(cat)}">${dot(cat)}<span>${esc(cat)}</span><span class="n">${items.length}</span></button>
        <div class="rows">${items.map(rowHtml).join("")}</div>
      </section>`).join(""));
  }

  function tilesHtml(all) {
    return `<div class="cats${S.intro ? " intro" : ""}">${(canAdd() ? S.sections.concat([{ add: true }]) : S.sections).map((s, i) => {
      if (s.add) return `<button type="button" class="cat add" data-action="addgroup" style="--n:${i}"><span class="dot">${icon("plus")}</span><span class="txt"><span class="nm">Add a group</span><span class="ds">A new section</span></span></button>`;
      const c = tallyOf(inCat(all, s.cat));
      return `<button type="button" class="cat" data-action="cat" data-cat="${esc(s.cat)}" style="--n:${i}">${dot(s.cat, pip(c))}<span class="txt"><span class="nm">${esc(s.cat)}</span><span class="ds">${sumHtml(c)}</span></span></button>`;
    }).join("")}</div>`;
  }
  function railHtml(all) {
    return `<button type="button" class="chip home" data-action="cat" data-cat="">${icon("grid")}All</button><div class="chips">${S.sections.map(s => {
      const on = s.cat === S.cat;
      return `<button type="button" class="chip${on ? " on" : ""}" data-action="cat" data-cat="${esc(s.cat)}"${on ? ' aria-current="true"' : ""}>${dot(s.cat)}${esc(s.cat)}${pip(tallyOf(inCat(all, s.cat)))}</button>`;
    }).join("")}</div>`;
  }
  function catHtml(items) {
    const tabs = classTabs(items);
    let sub = S.sub.get(S.cat) || "";
    if (sub && !tabs.some(t => t[0] === sub)) sub = "";
    const add = spec => canAdd() ? `<button type="button" class="row addrow" data-action="additem" data-spec="${esc(spec)}" data-by="${items.some(it => it.tab) ? "tab" : "spec"}"><span class="plus">${icon("plus")}</span><span class="txt"><span class="nm">Add ${spec ? esc(spec) + " " : ""}material</span></span></button>` : "";
    const slab = (list, spec) => list.length || canAdd() ? `<div class="rows">${list.map(rowHtml).join("")}${add(spec || "")}</div>` : `<div class="empty"><b>Nothing in ${esc(S.cat)} yet.</b>Items show up here once they're added to this group in the master sheet.</div>`;
    if (!tabs.length) return slab(items);
    const byTab = items.some(it => it.tab);
    const of = v => items.filter(it => byTab ? (it.tab || "Other") === v : it.spec === v);
    return `<div class="subs${tabs.length > 3 ? " many" : ""}" role="tablist" aria-label="${byTab ? "Tabs" : "Class"}">${[["", items.length]].concat(tabs).map(([v, n]) => `<button type="button" class="sub" role="tab" data-action="sub" data-v="${esc(v)}" aria-selected="${v === sub}">${esc(v || "All")}<span>${n}</span></button>`).join("")}</div>
      ${sub ? slab(of(sub), sub) : tabs.map(([v]) => `<h3 class="cls-h">${esc(v)}</h3>${slab(of(v), v)}`).join("")}`;
  }

  function rowHtml(it) {
    const flagged = it.status !== "OK";
    let sub = it.desc && it.desc !== it.name ? esc(it.desc) : "";
    if (flagged && it.when) {
      sub = esc(whoText(it.by) + ", " + whenText(it.when));
      if (it.note) sub += `: <span class="note">“${esc(it.note)}”</span>`;
    }
    const tag = flagged ? `<span class="flag ${ST[it.status].cls}">${ST[it.status].flag}</span>` : `<span class="okm">${icon("check")}<span class="sr">In stock</span></span>`;

  // ---------- the phone's Back button
  // Going into a section or onto another screen, and opening an item, each add a step to the browser's
  // history. So Back closes the item, then goes back to the section buttons, instead of leaving the app.
  const H = { api: null, depth: 0, params: null, last: "", base: null };
  const navNow = () => ({ tab: S.tab, cat: S.cat, filter: S.filter, q: !!S.q.trim(), open: S.open });
  const navLevel = n => (n.tab !== "stock" || n.cat || n.filter || n.q ? 1 : 0) + (n.open ? 1 : 0);
  const navParams = () => H.params || (S.me.fromUrl && S.me.code ? { key: S.me.code } : {});
  function navSync() {
    if (!H.api || !S.signedIn) return;
    const n = navNow(), key = JSON.stringify(n);
    if (key === H.last) return;
    H.last = key;
    try {
      if (navLevel(n) > H.depth) { n.d = ++H.depth; H.api.push(n, navParams()); }
      else { n.d = H.depth; H.api.replace(n, navParams()); }
    } catch (e) { H.api = null; }
  }
  function onBack(e) {
    const n = (e && e.state) || H.base || {};
    H.depth = n.d || 0;
    S.tab = ["stock", "order", "recent", "me"].includes(n.tab) ? n.tab : "stock";
    S.cat = n.cat || null; S.filter = n.filter || ""; S.open = n.open || null; S.done = null;
    if (!n.q) { S.q = ""; $("#q").value = ""; $("#qx").hidden = true; }
    H.last = JSON.stringify(navNow());
    if (S.signedIn) render();
  }
  function navStart() {
    try {
      const gs = window.google && google.script;
      if (!gs || !gs.history || !gs.history.setChangeHandler) {
        if (!window.history || !history.pushState) return;
        H.api = { push(state) { history.pushState(state, ""); }, replace(state) { history.replaceState(state, ""); } };
        H.params = {};
        // After a reload the phone still has the steps from before; carry on from where this one sits.
        H.depth = history.state && history.state.d ? history.state.d : 0;
        H.base = navNow();
        H.last = JSON.stringify(H.base);
        window.addEventListener("popstate", e => onBack({ state: e.state }));
        return;
      }
      H.api = gs.history;
      H.base = navNow();
      H.last = JSON.stringify(H.base);
      gs.history.setChangeHandler(onBack);
      if (gs.url && gs.url.getLocation) gs.url.getLocation(loc => { H.params = (loc && loc.parameter) || {}; });
    } catch (e) { H.api = null; }
  }

  // ---------- QR reports: what people send by scanning the QR code by an item (Charlie only)
  const QR_WORD = { low: "Running low", out: "All out", count: "Counted" };
  const QR_DONE = { ok: "Approved", no: "Dismissed", back: "Taken back" };
  function waitingQr() { return S.me.isOwner && !S.readOnly ? S.scans.filter(r => r.status === "wait") : []; }
  function qrTag(r) {
    if (r.kind === "out") return `<span class="flag sm out">OUT</span>`;
    if (r.kind === "low") return `<span class="flag sm low">LOW</span>`;
    return `<span class="qr-count">COUNT ${esc(r.qty)}</span>`;
  }
  // A report goes out of date when the item was marked or counted after it was sent.
  function qrStale(r, it) {
    if (!it) return "That item isn't in the master sheet anymore.";
    if (r.kind === "count") return it.counted && it.counted > r.at + 60000 ? "a newer count was saved " + whenText(it.counted) + "." : "";
    if (it.when && it.when > r.at + 60000) return whoText(it.by) + " marked it " + (it.status === "OK" ? "in stock" : ST[it.status].flag) + " " + whenText(it.when) + ".";
    return "";
  }
  function qrEffect(r, it) {
    if (r.kind === "count") {
      const to = statusFromCount(it.status, r.qty, num(it.lowAt));
      return "Approve saves the count (" + r.qty + " " + unitWord(it.unit, r.qty) + ")" + (to !== it.status ? " and marks it " + (to === "OK" ? "in stock" : ST[to].flag) + "." : ".");
    }
    const to = r.kind === "out" ? "OUT" : "LOW";
    return it.status === to ? "It's already marked " + to + "." : "Approve marks it " + to + " in the master sheet.";
  }
  function qrRow(r, withName) {
    const it = S.items.get(r.item);
    const stale = qrStale(r, it);
    const who = (r.from || "Someone") + (r.verified ? " (app link)" : " (typed name)");
    const title = withName ? esc(it ? it.name : (r.name || r.item)) : esc(QR_WORD[r.kind]) + (r.kind === "count" ? " " + esc(r.qty) : "");
    return `<div class="qr-row">
      <div class="qr-top">${qrTag(r)}<b>${title}</b></div>
      ${r.note ? `<div class="qr-note">“${esc(r.note)}”</div>` : ""}
      <div class="qr-sub">${esc(who)}, ${esc(whenText(r.at))}</div>
      <div class="qr-eff${stale ? " stale" : ""}">${esc(stale ? "Out of date: " + stale + " Dismiss it." : qrEffect(r, it))}</div>
      <div class="row-acts">${stale ? "" : `<button type="button" class="btn sm go" data-action="qr-ok" data-id="${esc(r.id)}">Approve</button>`}<button type="button" class="btn sm" data-action="qr-no" data-id="${esc(r.id)}">Dismiss</button></div>
    </div>`;
  }
  function qrCard() {
    if (!S.me.isOwner || S.readOnly) return "";
    const wait = waitingQr();
    const old = S.scans.filter(r => r.status !== "wait");
    if (!wait.length && !old.length) return "";
    const fresh = wait.filter(r => !qrStale(r, S.items.get(r.item)));
    let html = `<section class="qr" id="qrCard"><h3>From QR codes <span>${wait.length ? wait.length + " waiting" : "All caught up"}</span></h3>
      <p>What people sent by scanning the QR code by an item. The master sheet doesn't change until you approve it.</p>`;
    html += wait.map(r => qrRow(r, true)).join("");
    if (fresh.length > 1) html += `<div class="row-acts"><button type="button" class="btn sm go" data-action="qr-all">Approve all ${fresh.length}</button></div>`;
    if (old.length) {
      html += `<details><summary>Decided in the last two weeks (${old.length})</summary>${old.slice(0, 40).map(r =>
        `<div class="qr-old">${esc((S.items.get(r.item) || {}).name || r.name || r.item)}: ${esc(QR_WORD[r.kind])}${r.kind === "count" ? " " + esc(r.qty) : ""}, ${esc(firstName(r.from) || "Someone")}: <b>${esc(QR_DONE[r.status] || r.status)}</b></div>`).join("")}</details>`;

  function decideQr(ids, act) {

  // ---------- Order: what's low or out, by supplier, ready to text or copy
  function supplierGroups(list) {
    const groups = new Map();
    list.forEach(it => {
      const s = it.supplier || "Other";
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(it);
    });
    const rank = s => { const i = SUPPLIER_ORDER.indexOf(s); return i < 0 ? 99 : i; };
    return [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
  }

    const lines = ["Materials to order, " + dayText(Date.now()).replace(/^Today$/, new Date().toLocaleDateString()) + ":"];

      lines.push("", sup + ":");

        lines.push("- " + it.name + (part ? " (" + part + ")" : "") + ", " + it.status);

    return lines.join("\n");
