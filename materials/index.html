    let now = "";
    if (it.status !== "OK" || it.when) {
      now = `<div class="now-line"><span class="flag ${st.cls}">${st.flag}</span><span>${it.when ? (it.status === "OK" ? "Marked in stock" : "Marked " + st.flag) + " by " + esc(whoText(it.by, true)) + ", " + esc(whenText(it.when)) : "Set to " + st.flag + " in the master sheet"}${it.note ? `<span class="nt">“${esc(it.note)}”</span>` : ""}</span></div>`;
    }
    let act = "";
    if (S.done && S.done.key === it.key) act = doneHtml(it);
    else if (!S.readOnly) {
      act = `<div class="sh-h">Set the stock</div>
        <label class="sr" for="noteIn">Note</label>
        <input class="note-in" id="noteIn" maxlength="140" placeholder="Add a note (optional)" autocomplete="off">
        <div class="marks">${MARK_ORDER.map(k => `<button type="button" class="mark ic ${ST[k].cls}${it.status === k ? " now" : ""}" data-action="mark" data-key="${esc(it.key)}" data-to="${k}" data-sheet="1"><span class="mi">${icon(MARK_ICON[k])}</span><span class="mt">${ST[k].word}<small>${ST[k].hint}</small></span></button>`).join("")}</div>`;
    }
    const qty = num(it.qty), lowAt = num(it.lowAt);
    let count = "";
    if (!S.readOnly && !(S.done && S.done.key === it.key)) {
      count = `<div class="sh-h">Count it (optional)</div>
        <form data-form="count" data-key="${esc(it.key)}" autocomplete="off">
          <div class="count"><button type="button" class="step" data-action="step" data-d="-1" aria-label="One less">−</button>
            <label class="sr" for="countIn">How many on hand</label><input id="countIn" name="qty" type="number" inputmode="numeric" min="0" step="1" value="${qty === null ? "" : qty}" placeholder="?">
            <button type="button" class="step" data-action="step" data-d="1" aria-label="One more">+</button>
            <span class="unit">${esc(unitWord(it.unit, qty))} on hand</span></div>
          <div class="count-acts"><button class="btn sm go" type="submit">Save count</button></div>
          <div class="small-note">${it.counted ? "Last counted " + esc(whenText(it.counted)) + (qty !== null ? ": " + esc(qty) : "") + ". " : ""}${lowAt !== null ? "Reorder at " + esc(lowAt) + ": counts this low or lower show LOW." : ""}</div>
        </form>`;
      if (S.me.isOwner) {
        count += `<form data-form="lowat" data-key="${esc(it.key)}" autocomplete="off" style="margin-top:12px">
          <label class="field"><span>Reorder at: a count this low or lower shows LOW</span>
            <span class="count"><input name="v" type="number" inputmode="numeric" min="0" step="1" value="${lowAt === null ? "" : lowAt}" placeholder="?" aria-label="Reorder at"><button class="btn sm" type="submit">Save</button></span></label>
        </form>`;
      }
    }
    const part = it.webb ? (it.webbUrl ? `<a href="${esc(it.webbUrl)}" target="_blank" rel="noopener">${esc(it.webb)}</a>` : esc(it.webb)) : "";
    const facts = [
      ["Supplier", esc(it.supplier)],
      ["FW Webb #", part],
      ["Mfr part #", esc(it.mfr)],
      ["Unit cost", esc(money(it.cost))],
      ["Unit", esc(it.unit)],
      ["Location", esc(it.loc)],
      ["Item ID", esc(it.id)],
      ["Notes", esc(it.notes)]
    ].filter(f => f[1]);
    const qrw = waitingQr().filter(r => r.item === it.key);
    const qrBlock = qrw.length ? `<div class="qr in-sheet"><h3>From the QR code <span>${qrw.length} waiting</span></h3>${qrw.map(r => qrRow(r, false)).join("")}</div>` : "";
    el.innerHTML = `<div class="grab"></div>
      <div class="sh-top"><div class="t"><h2 id="sheetTitle">${esc(it.name)}</h2>${it.desc && it.desc !== it.name ? `<p>${esc(it.desc)}</p>` : ""}</div>
        <button type="button" class="x-btn" data-action="close" aria-label="Close">${icon("x")}</button></div>
      ${now}${qrBlock}${act}${count}
      ${facts.length ? `<dl class="facts">${facts.map(f => `<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join("")}</dl>` : ""}`;
  }
  function unitWord(u, n) {
    u = String(u || "").trim();
    if (!u || u === "ea") return n === 1 ? "piece" : "pieces";
    if (n === 1) return u;
    return /s$/.test(u) ? u : /(x|z|ch|sh)$/.test(u) ? u + "es" : u + "s";
  }
  function doneHtml(it) {
    const d = S.done;
    const st = ST[d.to];
    const targets = textTargets();
    const body = alertText(it, d.to, d.note, d.qty);
    const who = targets.length ? namesText(targets) : "Charlie";
    const missing = targets.length && targets.every(t => !t.phone);
    return `<div class="done" role="status">
      <div class="hd">Saved. Let ${esc(who)} know.</div>
      <p>${st.flag === "OUT" ? "It's out, so" : "It's low, so"} a text gets it ordered.${!targets.length || missing ? " Pick who to text in your messages app." : ""}</p>
      <a class="btn go big" href="${esc(smsHref(targets, body))}" target="_top" data-action="texted">${icon("text")}Text ${esc(who)}</a>
      <div class="msg">${esc(body)}</div>
      <div class="acts"><button type="button" class="btn" data-action="close">Done</button><button type="button" class="btn quiet" data-action="undo">Undo</button></div>
    </div>`;
  }

  // ---------------------------------------------------------------- actions
  let lastUndo = null, flashT = null;
  function mark(key, to, fromSheet) {
    const it = S.items.get(key);
    if (!it || S.readOnly) return;
    const noteEl = fromSheet ? $("#noteIn") : null;
    const note = noteEl ? noteEl.value.trim() : "";
    if (it.status === to && !note) {
      toast("Already marked " + (to === "OK" ? "in stock" : ST[to].flag) + ".");
      return;
    }
    const prev = { status: it.status, note: it.note || "" };
    S.flash = key;
    clearTimeout(flashT);
    flashT = setTimeout(() => { S.flash = null; }, 1500);
    const op = queue({ t: "status", key: key, to: to, note: note });
    lastUndo = { opId: op.id, key: key, prev: prev };
    const alert = (to === "OUT" || to === "LOW") && (textTargets().length > 0 || !S.me.isOwner);
    if (fromSheet && alert) {
      S.done = { key: key, to: to, note: note, opId: op.id, prev: prev };
      renderSheet();
      return;
    }
    if (fromSheet) closeItem();
    toast("Marked " + (to === "OK" ? "in stock" : ST[to].flag) + ": " + it.name + ".", "Undo", undoLast);
  }
  function undoLast() {
    const u = lastUndo;
    lastUndo = null;
    if (!u) return;
    const i = D.outbox.findIndex(op => op.id === u.opId);
    if (i >= 0 && !D.inflight.has(u.opId)) { D.outbox.splice(i, 1); saveOutbox(); }
    else queue({ t: "status", key: u.key, to: u.prev.status, note: "Undo" });
    S.done = null;
    derive();
    render();
    toast("Undone.");
  }
  function saveCount(form) {
    const key = form.dataset.key, it = S.items.get(key);
    const v = num(form.elements.qty.value);
    if (!it || v === null || v < 0 || Math.floor(v) !== v) { toast("Type a whole number, like 0 or 12."); return; }
    const before = it.status;
    const op = queue({ t: "count", key: key, qty: v });
    const now = S.items.get(key);
    lastUndo = null;
    if ((now.status === "OUT" || now.status === "LOW") && now.status !== before && (textTargets().length > 0 || !S.me.isOwner)) {
      S.done = { key: key, to: now.status, note: "", qty: v, opId: op.id, prev: { status: before } };
      renderSheet();
      return;
    }
    toast("Count saved: " + v + " " + unitWord(it.unit, v) + (now.status !== before ? ". Now " + (now.status === "OK" ? "in stock" : ST[now.status].flag) + "." : "."));
    renderSheet();
  }
  function saveLowAt(form) {
    const key = form.dataset.key;
    const raw = form.elements.v.value.trim();
    const v = raw === "" ? null : num(raw);
    if (raw !== "" && (v === null || v < 0)) { toast("Type a number, or leave it blank."); return; }
    queue({ t: "lowAt", key: key, value: v });
    toast(v === null ? "Reorder point cleared." : "Reorder at set to " + v + ".");
  }

  function copyText(text, msg) {
    const okMsg = msg || "Link copied.";
    let ok = false;
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      ta.remove();
    } catch (e) { ok = false; }
    if (ok) { toast(okMsg); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast(okMsg), () => toast("Couldn't copy. Press and hold to copy it instead."));
    } else toast("Couldn't copy. Press and hold to copy it instead.");
  }

  let toastTimer = null;
  function toast(msg, actLabel, act) {
    const el = $("#toast");
    clearTimeout(toastTimer);
    el.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button type="button" data-action="toastact">${esc(actLabel)}</button>` : ""}`;
    el._act = act || null;
    toastTimer = setTimeout(() => { el.innerHTML = ""; el._act = null; }, actLabel ? 7000 : 3500);
  }

  async function signIn(form) {
    const code = normCode(form.elements.code.value);
    const warn = $("#signinWarn");
    const say = m => { warn.textContent = m; warn.hidden = false; };
    if (code.length < 6) return say("Codes are 6 letters and numbers, like K7Q-4MP.");
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Checking…";
    let res;
    try { res = await rpc({ key: code, have: "", ops: [] }); }
    catch (e) { btn.disabled = false; btn.textContent = "Sign in"; return say(e && e.noGas ? e.message : "No connection. Check your signal and try again."); }
    if (!res.ok) { btn.disabled = false; btn.textContent = "Sign in"; return say(res.error === "bad_key" ? "That code isn't turned on. Check it, or ask Charlie for a new one." : "The app couldn't check the code just now. Try again."); }
    S.me.fromUrl = false;
    S.me.code = code;
    D.lastOk = Date.now();
    acceptMe(res.me);
    D.state = res.state; D.hash = res.hash; D.loaded = true;
    saveCache();
    loadOutbox();
    derive();
    render();
    onSignedIn();
    schedule(D.outbox.length ? 300 : POLL_MS);
  }

  function setTab(t) {
    if (S.tab === t) {
      if (t === "stock" && (S.cat || S.filter || S.q)) goCat("");
      else window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    S.tab = t;
    lsSet("tab", t);
    render();
    window.scrollTo(0, 0);
    navSync();
  }

  function onClick(e) {
    const a = e.target.closest("[data-action]");
    if (!a) return;
    const act = a.dataset.action;
    if (act === "texted") { setTimeout(() => { S.done = null; closeItem(); toast("Thanks. The label is saved either way."); }, 400); return; }
    if (a.tagName === "A") return;
    e.preventDefault();
    if (act === "tab") setTab(a.dataset.tab);
    else if (act === "open") openItem(a.dataset.key);
    else if (act === "close") closeItem();
    else if (act === "mark") mark(a.dataset.key, a.dataset.to, !!a.dataset.sheet);
    else if (act === "undo") undoLast();
    else if (act === "filter") { S.filter = S.filter === a.dataset.st ? "" : a.dataset.st; renderStock(); navSync(); }
    else if (act === "clear") { S.filter = ""; S.q = ""; $("#q").value = ""; $("#qx").hidden = true; renderStock(); navSync(); }
    else if (act === "cat") goCat(a.dataset.cat);
    else if (act === "addgroup") openAdd({ kind: "group" });
    else if (act === "additem") openAdd({ kind: "item", cat: S.cat, spec: a.dataset.by === "tab" ? "" : a.dataset.spec || "", tab: a.dataset.by === "tab" ? a.dataset.spec || "" : "" });
    else if (act === "sub") { S.sub.set(S.cat, a.dataset.v); renderStock(); listTop(); }
    else if (act === "copy") copyText(a.dataset.text, a.dataset.msg);
    else if (act === "step") {
      const inp = $("#countIn");
      const v = Math.max(0, (num(inp.value) || 0) + Number(a.dataset.d));
      inp.value = String(inp.value === "" && Number(a.dataset.d) < 0 ? 0 : v);
    }
    else if (act === "refresh") { sync({ full: true }); toast("Checking…"); }
    else if (act === "qr-ok") decideQr([a.dataset.id], "ok");
    else if (act === "qr-no") decideQr([a.dataset.id], "no");
    else if (act === "qr-all") decideQr(waitingQr().filter(r => !qrStale(r, S.items.get(r.item))).map(r => r.id), "ok");
    else if (act === "editp") { S.editPerson = a.dataset.code || null; renderMe(); }
    else if (act === "install") {
      const ev = D.installEvt;
      if (ev) { D.installEvt = null; ev.prompt(); (ev.userChoice || Promise.resolve()).then(() => { if (S.tab === "me") renderMe(); }); }
    }
    else if (act === "toastact") { const f = $("#toast")._act; $("#toast").innerHTML = ""; if (f) f(); }
  }

  async function onSubmit(e) {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const kind = f.dataset.form;
    if (kind === "signin") return signIn(f);
    if (kind === "addgroup" || kind === "additem") {
      const v = n => (f.elements[n] ? f.elements[n].value : "").trim().replace(/\s+/g, " ");
      const a = S.adding || {};
      if (kind === "addgroup") {
        const cat = v("cat");
        if (!cat) return;
        if (S.sections.some(s => s.cat.toLowerCase() === cat.toLowerCase())) { toast("There's already a group called " + cat + "."); return; }
        queue({ t: "group+", cat: cat });
        S.adding = null; closeItem();
        goCat(cat);
        toast("Added " + cat + ". Now add what goes in it.");
        return;
      }
      const desc = v("desc");
      if (!desc) return;
      if ([...S.items.values()].some(it => it.cat === a.cat && it.name.toLowerCase() === desc.toLowerCase())) { toast(desc + " is already in " + a.cat + "."); return; }
      queue({ t: "item+", cat: a.cat, spec: a.spec || "", tab: a.tab === "Other" ? "" : a.tab || "", desc: desc, nick: v("nick"), unit: v("unit"), supplier: v("supplier") });
      S.adding = null; closeItem();
      toast("Added " + desc + ".");
      return;
    }
    if (kind === "count") return saveCount(f);
    if (kind === "lowat") return saveLowAt(f);
    if (kind === "myphone") {
      const res = await sendNow({ t: "person", code: S.me.code, phone: f.elements.phone.value.trim(), alerts: f.elements.alerts.checked });
      if (res) toast("Saved.");
      return;
    }
    if (kind === "person") {
      const res = await sendNow({ t: "person", code: f.dataset.code, name: f.elements.name.value.trim(), role: f.elements.role.value, phone: f.elements.phone.value.trim(), alerts: f.elements.alerts.checked });
      if (res) { S.editPerson = null; renderMe(); toast("Saved."); }
      return;
    }
    if (kind === "addperson") {
      const name = f.elements.name.value.trim();
      if (!name) return;
      const res = await sendNow({ t: "person+", name: name, role: f.elements.role.value });
      if (res) {
        const p = S.people.filter(x => x.name === name).pop();
        S.newPerson = p ? p.code : null;
        renderMe();
      }
    }
  }

  // ---------------------------------------------------------------- start
  function init() {
    S.tab = lsGet("tab", "stock");
    if (!["stock", "order", "recent", "me"].includes(S.tab)) S.tab = "stock";
    lsDel("collapsed");
    navStart();
    document.addEventListener("click", onClick);
    document.addEventListener("submit", onSubmit);
    $("#scrim").addEventListener("click", closeItem);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && S.open) closeItem(); });
    const q = $("#q"), qx = $("#qx");
    q.addEventListener("input", () => { S.q = q.value; qx.hidden = !q.value; renderStock(); navSync(); });
    qx.addEventListener("click", () => { q.value = ""; S.q = ""; qx.hidden = true; renderStock(); navSync(); q.focus(); });
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); D.installEvt = e; if (S.signedIn && S.tab === "me") renderMe(); });
    window.addEventListener("appinstalled", () => { D.installEvt = null; if (S.signedIn && S.tab === "me") renderMe(); });
    // A copy of the app stays on the phone, so it opens with no signal. A new version takes over the next time it opens.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").catch(() => { /* still works while open */ });
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!had) { had = true; return; }
        toast("There's a new version of the app.", "Reload", () => location.reload());
      });
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.me.code) sync({ full: true }); });
    window.addEventListener("online", () => { if (S.me.code) sync(); });
    start();
  }

  function start() {
    const boot = window.BOOT;
    if (boot && boot.ok) {
      S.me.fromUrl = true;
      D.lastOk = Date.now();
      acceptMe(boot.me);
      D.state = boot.state; D.hash = boot.hash || ""; D.loaded = true;
      loadOutbox();
      derive();
      render();
      schedule(D.outbox.length ? 300 : POLL_MS);
      return;
    }
    if (boot && boot.error === "bad_key") S.signinMsg = "That link has been turned off. Ask Charlie for a new one.";
    else if (boot && boot.error === "server") S.signinMsg = "The app couldn't reach the sheet just now. Try again in a minute.";
    // A link with ?key= on the end signs this phone in; the code is then kept and the link tidied up.
    let fromLink = "";
    try { fromLink = normCode(new URLSearchParams(location.search).get("key") || ""); } catch (e) { fromLink = ""; }
    if (fromLink) {
      if (fromLink !== normCode(lsGet("code", ""))) lsSet("code", fromLink);
      try { history.replaceState(history.state, "", location.pathname); } catch (e) { /* fine */ }
    }
    const stored = normCode(lsGet("code", ""));
    const cache = stored ? loadCache(stored) : null;
    if (cache) {
      S.me.code = stored;
      acceptMe(cache.me);
      D.state = cache.state; D.hash = cache.hash || ""; D.loaded = true; D.lastOk = cache.at || 0; D.fromCache = true;
      loadOutbox();
      derive();
      render();
      sync({ full: true });
      return;
    }
    if (stored && !(boot && boot.error === "bad_key")) {
      S.me.code = stored;
      S.checking = true;
      loadOutbox();
      render();
      sync({ full: true }).then(() => {
        S.checking = false;
        if (S.signedIn) return;
        if (D.offline && S.me.code) S.signinMsg = "No connection right now. The app will keep trying.";
        render();
      });
      return;
    }
    render();
  }

  // Starts over as someone else (the preview's "see it as" switch).
  function reboot(boot) {
    clearTimeout(D.timer);
    S.me = { name: "", role: "", code: "", isOwner: false, fromUrl: false };
    S.signedIn = false; S.open = null; S.done = null; S.editPerson = null; S.newPerson = null; S.filter = ""; S.cat = null; S.signinMsg = "";
    D.outbox = []; D.state = null; D.hash = ""; D.loaded = false;
    window.BOOT = boot;
    closeSheetDom();
    start();
    window.scrollTo(0, 0);
  }

  window.__MAT = { S: S, D: D, H: H, sync: sync, reboot: reboot, onBack: onBack, matches: matches, statusFromCount: statusFromCount, alertText: alertText, smsHref: smsHref };
  init();
})();

</script>
</body>
</html>
